<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINTREND — Pinterest Trending Blog Navbar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 150vh;
      background-color: #141416;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* =========================================
       100% FULL-WIDTH GLASS NAVBAR
    ========================================= */
    .navbar {
      width: 100%;
      height: 74px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: rgba(22, 22, 26, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 0 0;
    }

    /* =========================================
       বামপাশ: বাঁকানো লোগো
    ========================================= */
    .logo-box {
      height: 74px;
      background: #DDF930;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 46px 0 28px;
      margin: 0;
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.5px;
      clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .logo-box:hover {
      background: #e6ff47;
    }

    /* =========================================
       মাঝখান: মেনু লিংক ও ব্যাকগ্রাউন্ড হোভার
    ========================================= */
    .nav-links {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 14px;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
    }

    .nav-link {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.92);
      font-size: 15.5px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    /* লিংকের ওপর মাউস নিলে ব্যাকগ্রাউন্ড হোভার ইফেক্ট */
    .nav-link:hover {
      background: #DDF930;
      color: #111111;
      box-shadow: 0 0 0 3px rgba(221, 249, 48, 0.22), 0 0 16px rgba(221, 249, 48, 0.35);
      transform: translateY(-1px);
    }

    /* Trend লিংকের ওপরের ডানপাশে লাল ডট */
    .trend-link {
      position: relative;
    }

    .trend-dot {
      position: absolute;
      top: 5px;
      right: 8px;
      width: 7px;
      height: 7px;
      background: #FF3B30;
      border-radius: 50%;
      box-shadow: 0 0 8px #FF3B30;
    }

    /* Explore বাটনের অ্যাক্টিভ/টগল করা গ্লোয়িং পিল স্টাইল */
    .explore-btn.active {
      background: #DDF930;
      color: #111111;
      box-shadow: 0 0 0 3px rgba(221, 249, 48, 0.26), 0 0 18px rgba(221, 249, 48, 0.35);
    }

    .explore-btn .chevron {
      width: 15px;
      height: 15px;
      transition: transform 0.25s ease;
    }

    .explore-btn.active .chevron {
      transform: rotate(180deg);
    }

    /* =========================================
       EXPLORE ড্রপডাউন মেনু ও ব্যাকগ্রাউন্ড হোভার
    ========================================= */
    .dropdown-card {
      position: absolute;
      top: calc(100% + 16px);
      left: 0;
      width: 265px;
      background: rgba(24, 24, 28, 0.88);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 12px 10px;
      list-style: none;
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.45);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s ease;
    }

    .dropdown-card.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-card li {
      position: relative;
      margin-bottom: 4px;
    }

    .dropdown-card li:last-child {
      margin-bottom: 0;
    }

    .dropdown-card li a {
      position: relative;
      display: block;
      padding: 11px 16px;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 400;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .dropdown-card li a:hover,
    .dropdown-card li a.featured {
      background: rgba(221, 249, 48, 0.16);
      color: #DDF930;
      font-weight: 500;
    }

    .dropdown-card li a::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 75%;
      background: #DDF930;
      border-radius: 0 4px 4px 0;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 0 10px rgba(221, 249, 48, 0.5);
    }

    .dropdown-card li a:hover::before,
    .dropdown-card li a.featured::before {
      opacity: 1;
    }

    /* =========================================
       ডানপাশ: শুধু সার্চ আইকন
    ========================================= */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin: 0;
      flex-shrink: 0;
    }

    .search-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.26);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .search-icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: #ffffff;
      transition: stroke 0.25s ease;
    }

    .search-icon-btn:hover,
    .search-icon-btn.active {
      background: #DDF930;
      border-color: #DDF930;
      transform: scale(1.06);
      box-shadow: 0 0 16px rgba(221, 249, 48, 0.35);
    }

    .search-icon-btn:hover svg,
    .search-icon-btn.active svg {
      stroke: #111111;
    }

    .search-popup {
      position: absolute;
      top: calc(100% + 16px);
      right: 0;
      width: 310px;
      background: rgba(24, 24, 28, 0.9);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s ease;
    }

    .search-popup.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .search-popup input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-popup input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-popup input:focus {
      border-color: #DDF930;
    }

    /* =========================================
       ডেমো পিন্টারেস্ট ব্যাকগ্রাউন্ড
    ========================================= */
    .pinterest-bg-grid {
      padding: 20px;
      columns: 5 220px;
      column-gap: 18px;
      filter: blur(6px) brightness(0.85);
      transform: scale(1.02);
    }

    .pin-card {
      break-inside: avoid;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      background: #2a2826;
    }

    .pin-card img {
      width: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 100% Full-Width Glass Navbar -->
  <nav class="navbar">

    <!-- বামপাশ: বাঁকানো লোগো -->
    <a href="#" class="logo-box">PINTREND</a>

    <!-- মাঝখান: মেনু লিংক -->
    <ul class="nav-links">
      <li class="nav-item">
        <a href="#" class="nav-link">Home</a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link trend-link">
          Trend <span class="trend-dot"></span>
        </a>
      </li>

      <!-- Explore টগল ড্রপডাউন -->
      <li class="nav-item">
        <button class="nav-link explore-btn" id="exploreBtn" aria-expanded="false">
          Explore
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <ul class="dropdown-card" id="exploreDropdown">
          <li><a href="#" class="featured">Aesthetics &amp; Wallpapers</a></li>
          <li><a href="#">Fashion &amp; Style</a></li>
          <li><a href="#">Home &amp; Decor</a></li>
          <li><a href="#">DIY &amp; Crafts</a></li>
          <li><a href="#">Food &amp; Recipes</a></li>
          <li><a href="#">Lifestyle</a></li>
        </ul>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">Guides</a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link">About</a>
      </li>
    </ul>

    <!-- ডানপাশ: শুধু সার্চ আইকন -->
    <div class="search-wrapper">
      <button class="search-icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <div class="search-popup" id="searchPopup">
        <input type="text" id="searchInput" placeholder="Search Pinterest trends...">
      </div>
    </div>

  </nav>

  <!-- ডেমো পিন্টারেস্ট ব্যাকগ্রাউন্ড -->
  <div class="pinterest-bg-grid">
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1513519245088-0292950250ca?auto=format&fit=crop&w=500&q=80" alt="Decor" style="height: 320px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=500&q=80" alt="Fashion" style="height: 250px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=500&q=80" alt="Interior" style="height: 360px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80" alt="Food" style="height: 280px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=500&q=80" alt="Aesthetic" style="height: 340px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1483985988635-767283938f82?auto=format&fit=crop&w=500&q=80" alt="Style" style="height: 290px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1540518614846-7eded433c457?auto=format&fit=crop&w=500&q=80" alt="Room" style="height: 330px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=500&q=80" alt="DIY" style="height: 260px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=500&q=80" alt="Living" style="height: 310px;"></div>
    <div class="pin-card"><img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=500&q=80" alt="Outfit" style="height: 350px;"></div>
  </div>

  <!-- ইন্টারঅ্যাক্টিভ টগল স্ক্রিপ্ট -->
  <script>
    const exploreBtn = document.getElementById('exploreBtn');
    const exploreDropdown = document.getElementById('exploreDropdown');
    const searchBtn = document.getElementById('searchBtn');
    const searchPopup = document.getElementById('searchPopup');
    const searchInput = document.getElementById('searchInput');
    const dropdownLinks = document.querySelectorAll('.dropdown-card li a');

    exploreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = exploreDropdown.classList.toggle('open');
      exploreBtn.classList.toggle('active', isOpen);
      exploreBtn.setAttribute('aria-expanded', isOpen);

      searchPopup.classList.remove('open');
      searchBtn.classList.remove('active');
    });

    dropdownLinks.forEach(link => {
      link.addEventListener('mouseenter', () => {
        dropdownLinks.forEach(item => item.classList.remove('featured'));
        link.classList.add('featured');
      });
    });

    searchBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = searchPopup.classList.toggle('open');
      searchBtn.classList.toggle('active', isOpen);

      if (isOpen) {
        setTimeout(() => searchInput.focus(), 100);
      }

      exploreDropdown.classList.remove('open');
      exploreBtn.classList.remove('active');
      exploreBtn.setAttribute('aria-expanded', 'false');
    });

    searchPopup.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    document.addEventListener('click', () => {
      exploreDropdown.classList.remove('open');
      exploreBtn.classList.remove('active');
      exploreBtn.setAttribute('aria-expanded', 'false');

      searchPopup.classList.remove('open');
      searchBtn.classList.remove('active');
    });
  </script>

</body>
</html>
